external_components:
- source:
    type: git
    url: https://github.com/bruxy70/Venetian-Blinds-Control
    ref: master
  components: [venetian_blinds]

substitutions:
  name: boneio-cm-l-07-0848ec
  friendly_name: BoneIO ESP Cover Mix Dół
  serial_prefix: esp   #Don't change it.

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  project:
    name: boneio.32x10-cover-mix-lights
    version: '0.7'

esp32:
  board: nodemcu-32s
  framework:
    type: esp-idf

ethernet:
  id: eth
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    pin: GPIO0
    mode: CLK_EXT_IN
  phy_addr: 1
  power_pin: GPIO16

dashboard_import:
  package_import_url: 
    github://boneIO-eu/esphome/boneio-cover_mix_lights_v0_7.yaml@latest
  import_full_config: true

packages:
  internals_packages:
    url: https://github.com/boneIO-eu/esphome
    ref: packages-v2.1.0
    files: [packages/devices/buzzer.yaml, packages/devices/serial_no.yaml, 
        packages/devices_v0_7/display.yaml, packages/devices_v0_7/i2c.yaml, 
        packages/devices_v0_7-v0_9/ina219.yaml, 
        packages/devices_v0_7-v0_9/lm75b.yaml, 
        packages/devices_v0_7-v0_9/pcf.yaml, packages/boards/cover/out01_02.yaml,
      packages/boards/cover/out03_04.yaml, packages/boards/cover/out05_06.yaml, 
        packages/boards/cover/out07_08.yaml, packages/boards/cover/out09_10.yaml,
      packages/boards/cover/out11_12.yaml, packages/boards/cover/out13_14.yaml, 
        packages/boards/cover/out15_16.yaml, 
        packages/boards/output/out19_20.yaml, 
        packages/boards/output/out21_22.yaml, 
        packages/boards/output/out23_24.yaml, 
        packages/boards/output/out25_26.yaml, 
        packages/boards/output/out27_28.yaml, 
        packages/boards/output/out29_30.yaml, 
        packages/boards/output/out31_32.yaml]

logger:
api:
  reboot_timeout: 0s
ota:
- platform: esphome
- platform: web_server

web_server:
  port: 80
  local: true

time:
- platform: homeassistant
  timezone: Europe/Warsaw
  id: homeassistant_time

switch:
- platform: gpio
  id: cover_open_09_out17
  pin:
    pcf8574: pcf_left
    number: 0
    mode:
      output: true
    inverted: true
  interlock: &cover_interlock_09 [cover_open_09_out17, cover_close_09_out18]
  interlock_wait_time: 5ms
  restore_mode: always off

- platform: gpio
  id: cover_close_09_out18
  pin:
    pcf8574: pcf_left
    number: 1
    mode:
      output: true
    inverted: true
  interlock: *cover_interlock_09
  restore_mode: always off

