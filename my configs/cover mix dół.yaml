binary_sensor:
- platform: gpio
  name: IN_01
  id: in_01
  pin:
    pcf8574: pcf_inputs_1to14
    number: 0
    mode:
      input: true
    inverted: true
  on_multi_click:
  - timing:
    - ON for at least 2s
    then:
    - lambda: |-
        auto call = id(cover_01).make_call();
        if (id(cover_01).current_operation == COVER_OPERATION_IDLE) {
          call.set_command_open();
        } else {
          call.set_command_stop();
        }
        call.perform();
  - timing:
    - ON for at most 0.4s
    - OFF for at least 0.1s
    then:
    - lambda: |-
        auto call = id(cover_01).make_call();
        if (id(cover_01).current_operation == COVER_OPERATION_IDLE) {
          call.set_tilt(std::min(1.0f, id(cover_01).tilt + 0.1f));
        } else {
          call.set_command_stop();
        }
        call.perform();

- platform: gpio
  name: IN_02
  id: in_02
  pin:
    pcf8574: pcf_inputs_1to14
    number: 1
    mode:
      input: true
    inverted: true
  on_multi_click:
